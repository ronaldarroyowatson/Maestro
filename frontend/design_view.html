<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maestro Design View – Canvas Prototype</title>
  <style>
    /* Basic layout: full-page canvas + simple top bar + right inspector */

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
    }

    #topbar {
      height: 40px;
      background: #020617;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      color: #e5e7eb;
      font-size: 14px;
    }

    #topbar button {
      background: #1d4ed8;
      border: none;
      color: #e5e7eb;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    #topbar button:hover {
      background: #2563eb;
    }

    #container {
      display: grid;
      grid-template-columns: 1fr 260px;
      height: calc(100% - 40px);
    }

    #canvas-container {
      position: relative;
      background: radial-gradient(circle at top left, #1f2937 0, #020617 60%);
    }

    #graphCanvas {
      position: absolute;
      inset: 0;
      cursor: grab;
    }

    #graphCanvas:active {
      cursor: grabbing;
    }

    #inspector {
      border-left: 1px solid #1f2937;
      background: #020617;
      padding: 10px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #inspector h2 {
      font-size: 14px;
      margin: 0 0 4px 0;
      color: #e5e7eb;
    }

    #inspector label {
      display: block;
      margin-top: 6px;
      margin-bottom: 2px;
      color: #9ca3af;
    }

    #inspector input,
    #inspector textarea,
    #inspector select {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border: 1px solid #374151;
      border-radius: 4px;
      color: #e5e7eb;
      padding: 4px 6px;
      font-size: 13px;
      resize: vertical;
    }

    #inspector textarea {
      min-height: 80px;
    }

    #jsonView {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: #020617;
      border: none;
      color: #e5e7eb;
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 12px;
      padding: 8px;
      display: none; /* toggled on/off */
    }

    #jsonContainer {
      display: none; /* toggled when JSON view is active */
      height: calc(100% - 40px);
    }
  </style>
</head>
<body>
  <!--
    Top bar: basic controls.
    - Add Agent: creates a new node on the canvas.
    - JSON View: toggles between graph canvas and raw JSON schema.
  -->
  <div id="topbar">
    <button id="addAgentBtn">Add Agent</button>
    <button id="toggleJsonBtn">JSON View</button>
    <span id="statusLabel"></span>
  </div>

  <!--
    Main container:
    - Left: canvas (graph view) or hidden when JSON view is active.
    - Right: inspector for selected node.
  -->
  <div id="container">
    <div id="canvas-container">
      <canvas id="graphCanvas"></canvas>
    </div>
    <div id="inspector">
      <h2>Inspector</h2>
      <div id="inspectorContent">
        <p style="color:#6b7280;">Select an agent node to edit its properties.</p>
      </div>
    </div>
  </div>

  <!--
    JSON container: shown when JSON view is active.
    We reuse the right inspector area and only swap the left side.
  -->
  <div id="jsonContainer">
    <textarea id="jsonView"></textarea>
  </div>

  <script>
    // ============================================================
    // Core data model for the graph
    // ============================================================
    // nodes: [{ id, x, y, width, height, name, model, prompt }]
    // edges: [{ from, to }]
    // This is the single source of truth for both the canvas and JSON.
    // ============================================================

    const graphState = {
      nodes: [],
      edges: [],
      nextId: 1,
      selectedNodeId: null,
      // pan + zoom
      offsetX: 0,
      offsetY: 0,
      scale: 1
    };

    // Some simple model options for now (local + cloud placeholders).
    const MODEL_OPTIONS = [
      "phi3:latest (local)",
      "llama3:8b (local)",
      "gpt-4o (cloud)",
      "claude-3.5 (cloud)"
    ];

    // Canvas + context
    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");

    // DOM elements
    const addAgentBtn = document.getElementById("addAgentBtn");
    const toggleJsonBtn = document.getElementById("toggleJsonBtn");
    const statusLabel = document.getElementById("statusLabel");
    const inspector = document.getElementById("inspector");
    const inspectorContent = document.getElementById("inspectorContent");
    const container = document.getElementById("container");
    const canvasContainer = document.getElementById("canvas-container");
    const jsonContainer = document.getElementById("jsonContainer");
    const jsonView = document.getElementById("jsonView");

    // Interaction state
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let lastMouseX = 0;
    let lastMouseY = 0;

    let isDraggingNode = false;
    let dragNodeId = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    let isConnecting = false;
    let connectFromNodeId = null;

    // ============================================================
    // Resize canvas to fill its container
    // ============================================================
    function resizeCanvas() {
      const rect = canvasContainer.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      draw();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // ============================================================
    // Utility: transform screen coords -> world coords (pan + zoom)
    // ============================================================
    function screenToWorld(x, y) {
      return {
        x: (x - graphState.offsetX) / graphState.scale,
        y: (y - graphState.offsetY) / graphState.scale
      };
    }

    // ============================================================
    // Node creation
    // ============================================================
    function addAgentNode() {
        const id = "agent_" + graphState.nextId++;
        const node = {
            id,
            x: 100 + Math.random() * 200,
            y: 80 + Math.random() * 120,
            width: 300,
            height: 100,
            name: "Agent " + graphState.nextId,
            model: MODEL_OPTIONS[0],
            prompt: "You are a helpful agent.",
            role: "default"   // <-- ADD THIS LINE
        };
        graphState.nodes.push(node);
        graphState.selectedNodeId = node.id;
        updateInspector();
        saveToLocalStorage();
        draw();
    }


    // ============================================================
    // Hit testing for nodes and ports
    // ============================================================
    function getNodeAt(worldX, worldY) {
      for (let i = graphState.nodes.length - 1; i >= 0; i--) {
        const n = graphState.nodes[i];
        if (
          worldX >= n.x &&
          worldX <= n.x + n.width &&
          worldY >= n.y &&
          worldY <= n.y + n.height
        ) {
          return n;
        }
      }
      return null;
    }

    function getPortPosition(node, side) {
      // side: "left" or "right"
      const y = node.y + node.height / 2;
      if (side === "left") {
        return { x: node.x, y };
      } else {
        return { x: node.x + node.width, y };
      }
    }

    function isOnRightPort(node, worldX, worldY) {
      const port = getPortPosition(node, "right");
      const dx = worldX - port.x;
      const dy = worldY - port.y;
      return dx * dx + dy * dy <= 25 * 25;
    }

    function isOnLeftPort(node, worldX, worldY) {
      const port = getPortPosition(node, "left");
      const dx = worldX - port.x;
      const dy = worldY - port.y;
      return dx * dx + dy * dy <= 25 * 25;
    }

    // ============================================================
    // Mouse events for pan, zoom, drag, connect
    // ============================================================
    canvas.addEventListener("mousedown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      lastMouseX = x;
      lastMouseY = y;

      const world = screenToWorld(x, y);
      // Hover node detection
    graphState.hoverNodeId = null;
    const hovered = getNodeAt(world.x, world.y);
    if (hovered) {
        graphState.hoverNodeId = hovered.id;
    }

      const node = getNodeAt(world.x, world.y);

      if (e.button === 1 || (e.button === 0 && e.altKey)) {
        // Middle-click or Alt+Left: pan
        isPanning = true;
        panStartX = x - graphState.offsetX;
        panStartY = y - graphState.offsetY;
        return;
      }

      if (e.button === 0 && node) {
        // Left-click on a node: either drag or connect
        graphState.selectedNodeId = node.id;
        updateInspector();

        // Check if on right port -> start connecting
        if (isOnRightPort(node, world.x, world.y)) {
          isConnecting = true;
          connectFromNodeId = node.id;
        } else {
          // Otherwise, drag node
          isDraggingNode = true;
          dragNodeId = node.id;
          dragOffsetX = world.x - node.x;
          dragOffsetY = world.y - node.y;
        }
        draw();
        return;
      }

      if (e.button === 0 && !node) {
        // Clicked empty space: deselect
        graphState.selectedNodeId = null;
        updateInspector();
        draw();
      }
    });

    canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const dx = x - lastMouseX;
  const dy = y - lastMouseY;
  lastMouseX = x;
  lastMouseY = y;

  const world = screenToWorld(x, y);

// Hover node detection
graphState.hoverNodeId = null;
const hovered = getNodeAt(world.x, world.y);
if (hovered) {
    graphState.hoverNodeId = hovered.id;
}

  // ============================
  // 1. Hover Port Detection
  // ============================
  graphState.hoverPort = null;

  for (const node of graphState.nodes) {
    const left = getPortPosition(node, "left");
    const right = getPortPosition(node, "right");

    const dxL = world.x - left.x;
    const dyL = world.y - left.y;
    const dxR = world.x - right.x;
    const dyR = world.y - right.y;

    if (Math.sqrt(dxL * dxL + dyL * dyL) < 12) {
      graphState.hoverPort = { nodeId: node.id, side: "left" };
      break;
    }

    if (Math.sqrt(dxR * dxR + dyR * dyR) < 12) {
      graphState.hoverPort = { nodeId: node.id, side: "right" };
      break;
    }
  }

  // ============================
  // 2. Panning
  // ============================
  if (isPanning) {
    graphState.offsetX = x - panStartX;
    graphState.offsetY = y - panStartY;
    draw();
    return;
  }

  // ============================
  // 3. Dragging a Node
  // ============================
  if (isDraggingNode && dragNodeId) {
    const node = graphState.nodes.find((n) => n.id === dragNodeId);
    if (node) {
      node.x = world.x - dragOffsetX;
      node.y = world.y - dragOffsetY;
      saveToLocalStorage();
      draw();
    }
    return;
  }

  // ============================
  // 4. Connection Preview Logic
  // ============================
  if (isConnecting && connectFromNodeId) {
    const hoverNode = getNodeAt(world.x, world.y);

    if (hoverNode && isOnLeftPort(hoverNode, world.x, world.y)) {
      const port = getPortPosition(hoverNode, "left");
      draw(port.x, port.y);  // snap to port
    } else {
      draw(world.x, world.y);
    }
    return;
  }

  // ============================
  // 5. Normal Redraw
  // ============================
  draw();
});

    canvas.addEventListener("mouseup", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const world = screenToWorld(x, y);

      if (isPanning) {
        isPanning = false;
      }

      if (isDraggingNode) {
        isDraggingNode = false;
        dragNodeId = null;
        saveToLocalStorage();
      }

      if (isConnecting && connectFromNodeId) {
        const targetNode = getNodeAt(world.x, world.y);
        if (targetNode && isOnLeftPort(targetNode, world.x, world.y)) {
          // Create edge
          if (targetNode.id !== connectFromNodeId) {
            graphState.edges.push({
              from: connectFromNodeId,
              to: targetNode.id
            });
            saveToLocalStorage();
          }
        }
        isConnecting = false;
        connectFromNodeId = null;
        draw();
      }
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const zoomFactor = 1.05;
      const oldScale = graphState.scale;
      const worldBefore = screenToWorld(x, y);

      if (e.deltaY < 0) {
        graphState.scale *= zoomFactor;
      } else {
        graphState.scale /= zoomFactor;
      }

      graphState.scale = Math.min(Math.max(graphState.scale, 0.3), 2.5);

      const worldAfter = screenToWorld(x, y);
      graphState.offsetX += (worldAfter.x - worldBefore.x) * graphState.scale;
      graphState.offsetY += (worldAfter.y - worldBefore.y) * graphState.scale;

      draw();
    }, { passive: false });

    // ============================================================
    // Drawing
    // ============================================================
    function draw(tempConnectX = null, tempConnectY = null) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(graphState.offsetX, graphState.offsetY);
      ctx.scale(graphState.scale, graphState.scale);

      // Draw edges
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#4b5563";
      ctx.lineCap = "round";

      for (const edge of graphState.edges) {
        const fromNode = graphState.nodes.find((n) => n.id === edge.from);
        const toNode = graphState.nodes.find((n) => n.id === edge.to);
        if (!fromNode || !toNode) continue;

        const p1 = getPortPosition(fromNode, "right");
        const p2 = getPortPosition(toNode, "left");

        const cp1x = p1.x + 40;
        const cp1y = p1.y;
        const cp2x = p2.x - 40;
        const cp2y = p2.y;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
        ctx.stroke();
      }
    // ===================== CONNECTION PREVIEW LINE =====================
    if (isConnecting && connectFromNodeId && tempConnectX !== null && tempConnectY !== null) {
    const fromNode = graphState.nodes.find(n => n.id === connectFromNodeId);
    if (fromNode) {
        const fromPort = getPortPosition(fromNode, "right");

        ctx.beginPath();
        ctx.moveTo(fromPort.x, fromPort.y);

        // Bézier control points (same style as final edges)
        const cp1x = fromPort.x + 40;
        const cp1y = fromPort.y;
        const cp2x = tempConnectX - 40;
        const cp2y = tempConnectY;

        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tempConnectX, tempConnectY);

        ctx.strokeStyle = "#4b5563"; // same color as final edges
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}



// Temporary connection line
  if (isConnecting && connectFromNodeId && tempConnectX !== null && tempConnectY !== null) {
    const fromNode = graphState.nodes.find((n) => n.id === connectFromNodeId);
    if (fromNode) {
      const p1 = getPortPosition(fromNode, "right");
      const p2 = { x: tempConnectX, y: tempConnectY };
      const cp1x = p1.x + 40;
      const cp1y = p1.y;
      const cp2x = p2.x - 40;
      const cp2y = p2.y;

      ctx.strokeStyle = "#60a5fa";
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      ctx.stroke();
    }
  }

  // Utility: lighten or darken a hex color
  function shade(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  const amt = Math.round(2.55 * percent * 100);
  const R = (num >> 16) + amt;
  const G = ((num >> 8) & 0x00FF) + amt;
  const B = (num & 0x0000FF) + amt;

  return (
    "#" +
    (
      0x1000000 +
      (R < 255 ? (R < 0 ? 0 : R) : 255) * 0x10000 +
      (G < 255 ? (G < 0 ? 0 : G) : 255) * 0x100 +
      (B < 255 ? (B < 0 ? 0 : B) : 255)
    )
      .toString(16)
      .slice(1)
  );
}

// Draw nodes
for (const node of graphState.nodes) {
    const isSelected = node.id === graphState.selectedNodeId;

    // ===================== ROLE COLOR THEME =====================
    const role = getRole(node);
    ctx.fillStyle = isSelected
        ? shade(role.color, 0.3)
        : shade(role.color, -0.4);
    ctx.strokeStyle = role.color;
    ctx.lineWidth = isSelected ? 3 : 2;
    // ============================================================

    const radius = 8;
    const x = node.x;
    const y = node.y;
    const w = node.width;
    const h = node.height;

    // Rounded rectangle
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // ===================== NODE HOVER HIGHLIGHT =====================
    if (graphState.hoverNodeId === node.id) {
        ctx.save();

        // Slight tint overlay using the role color
        ctx.fillStyle = shade(role.color, 0.4); // brighten slightly
        ctx.globalAlpha = 0.15;
        ctx.fillRect(x, y, w, h);

        ctx.restore();

        // Brightened border using role color
        ctx.strokeStyle = role.color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);
    }
    // ================================================================


    // ===================== ROLE ICON DRAW =====================
    const roleIcon = new Image();
    roleIcon.src = role.icon;
    if (roleIcon.complete) {
        const iconSize = 48;
        const iconX = x + 8;
        const iconY = y + (h - iconSize) / 2;
        ctx.drawImage(roleIcon, iconX, iconY, iconSize, iconSize);
    }
    // ==========================================================

    // ===================== MODEL ICON DRAW =====================
    const modelIcon = getModelIcon(node.model);
    if (modelIcon && modelIcon.complete) {
        const iconSize = 48;
        const iconX = x + w - iconSize - 8;
        const iconY = y + (h - iconSize) / 2;
        ctx.drawImage(modelIcon, iconX, iconY, iconSize, iconSize);
    }
    // ==========================================================

    // Text column boundaries
    const textLeft = x + 8 + 48 + 8;
    const textRight = x + w - 48 - 8 - 8;
    const textWidth = textRight - textLeft;
    const textCenter = textLeft + textWidth / 2;

    // Center alignment
    ctx.textAlign = "center";

    // Node title
    ctx.fillStyle = "#e5e7eb";
    ctx.font = "bold 15px system-ui";
    ctx.fillText(node.name, textCenter, y + 26);

    // Model line
    ctx.fillStyle = "#d1d5db";
    ctx.font = "13px system-ui";
    ctx.fillText("Model: " + node.model, textCenter, y + 48);

    // Ports
    const leftPort = getPortPosition(node, "left");
    const rightPort = getPortPosition(node, "right");

    ctx.fillStyle = "#f97316";
    ctx.beginPath();
    ctx.arc(leftPort.x, leftPort.y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#22c55e";
    ctx.beginPath();
    ctx.arc(rightPort.x, rightPort.y, 5, 0, Math.PI * 2);
    ctx.fill();

    // ===================== HOVER GLOW (INSERTED HERE) =====================
    if (graphState.hoverPort && graphState.hoverPort.nodeId === node.id) {
        const port = getPortPosition(node, graphState.hoverPort.side);

        ctx.beginPath();
        ctx.arc(port.x, port.y, 18, 0, Math.PI * 2);
        ctx.strokeStyle = graphState.hoverPort.side === "left" ? "#fb923c" : "#4ade80";
        ctx.lineWidth = 3;
        ctx.stroke();
    }
// ======================================================================

  }
  ctx.restore();
}
// ============================================================
// Model Registry (icons + install state)
// ============================================================

const MODEL_REGISTRY = [

    displayName: "Claude 3.5 (Cloud)",
    type: "cloud",

    icon: "icons/anthropic.png"
  }
];
// ===================== BEGIN HYBRID MODEL ICON LOADER =====================
const modelIconCache = {};
const defaultIconPath = "icons/default.png"; // add a simple fallback icon

function getModelIcon(modelId) {
  // 1. Try to find the model in the registry
  const entry = MODEL_REGISTRY.find(m => m.id === modelId);

  // 2. Determine the icon path
  let iconPath = null;

  if (entry && entry.icon) {
    // Explicit icon defined in registry
    iconPath = entry.icon;
  } else {
    // 3. Fallback: derive a filename from the model ID
    // Example: "phi3:latest" → "phi3.png"
    const base = modelId.split(":")[0];
    iconPath = `icons/${base}.png`;
  }

  // 4. If we've never loaded this icon before, load it now
  if (!modelIconCache[iconPath]) {
    const img = new Image();
    img.src = iconPath;
    modelIconCache[iconPath] = img;
  }

  // 5. If the icon fails to load, use the default
  const img = modelIconCache[iconPath];
  if (img && img.complete && img.naturalWidth > 0) {
    return img;
  }

  // Load default icon if not already cached
  if (!modelIconCache[defaultIconPath]) {
    const fallback = new Image();
    fallback.src = defaultIconPath;
    modelIconCache[defaultIconPath] = fallback;
  }

  return modelIconCache[defaultIconPath];
}
// ====================== END HYBRID MODEL ICON LOADER ======================

// ===================== BEGIN ROLE REGISTRY =====================
const ROLE_REGISTRY = [
  {
    id: "default",
    name: "Default",
    color: "#4b5563",
    icon: "icons/role-default.png"
  },
  {

// ====================== END ROLE REGISTRY =====================

// ===================== BEGIN ROLE LOOKUP =====================
function getRole(node) {
  return ROLE_REGISTRY.find(r => r.id === node.role)
      || ROLE_REGISTRY.find(r => r.id === "default");
}
// ====================== END ROLE LOOKUP =====================

// ============================================================
// Model Dropdown Renderer (icons + text + greyed-out)
// ============================================================

function renderModelDropdown(selectedId, onChange) {
  const wrapper = document.createElement("div");
  wrapper.style.display = "flex";
  wrapper.style.flexDirection = "column";
  wrapper.style.gap = "4px";
  wrapper.style.pointerEvents = "auto"; // IMPORTANT

  const select = document.createElement("select");
  select.style.width = "100%";
  select.style.padding = "4px";
  select.style.background = "#020617";
  select.style.color = "#e5e7eb";
  select.style.border = "1px solid #374151";
  select.style.borderRadius = "4px";

  MODEL_REGISTRY.forEach(model => {
    const option = document.createElement("option");
    option.value = model.id;
    option.textContent = model.displayName;

    if (!model.installed && model.type === "local") {
      option.style.color = "#6b7280"; // greyed out
    }

    if (model.id === selectedId) {
      option.selected = true;
    }

    select.appendChild(option);
  });

  select.addEventListener("change", () => {
    const chosen = MODEL_REGISTRY.find(m => m.id === select.value);
    onChange(chosen);
  });

  wrapper.appendChild(select);

  // Icon preview
  const iconPreview = document.createElement("img");
  const selectedModel = MODEL_REGISTRY.find(m => m.id === selectedId);
  iconPreview.src = selectedModel ? selectedModel.icon : "";
  iconPreview.style.width = "32px";
  iconPreview.style.height = "32px";
  iconPreview.style.marginTop = "6px";
  iconPreview.style.opacity = selectedModel && !selectedModel.installed ? "0.4" : "1";

  wrapper.appendChild(iconPreview);

  return wrapper;
}

// ============================================================
// Inspector Logic
// ============================================================

function updateInspector() {
  const node = graphState.nodes.find((n) => n.id === graphState.selectedNodeId);

  // If no node is selected, show placeholder text
  if (!node) {
    inspectorContent.innerHTML =
      '<p style="color:#6b7280;">Select an agent node to edit its properties.</p>';
    return;
  }

  // Clear inspector panel
  inspectorContent.innerHTML = "";

  // ------------------------------------------------------------
  // Agent Name
  // ------------------------------------------------------------
  const nameLabel = document.createElement("label");
  nameLabel.textContent = "Agent Name";

  const nameInput = document.createElement("input");
  nameInput.value = node.name;
  nameInput.addEventListener("input", () => {
    node.name = nameInput.value;
    saveToLocalStorage();
    draw();
  });

  inspectorContent.appendChild(nameLabel);
  inspectorContent.appendChild(nameInput);

// ------------------------------------------------------------
// Model Dropdown (ICON + TEXT VERSION)
// ------------------------------------------------------------
const modelLabel = document.createElement("label");
modelLabel.textContent = "Model";

// Use the new icon-enabled dropdown
const modelDropdown = renderModelDropdown(node.model, (chosenModel) => {
  node.model = chosenModel.id; // update model id
  saveToLocalStorage();
  draw();
  updateInspector(); // refresh icon preview
});

inspectorContent.appendChild(modelLabel);
inspectorContent.appendChild(modelDropdown);

// ===================== BEGIN ROLE DROPDOWN =====================
const roleLabel = document.createElement("label");
roleLabel.textContent = "Role:";
roleLabel.style.marginTop = "10px";
inspectorContent.appendChild(roleLabel);

const roleSelect = document.createElement("select");

// Populate dropdown from ROLE_REGISTRY
ROLE_REGISTRY.forEach(role => {
  const opt = document.createElement("option");
  opt.value = role.id;
  opt.textContent = role.name;
  if (node.role === role.id) opt.selected = true;
  roleSelect.appendChild(opt);
});

// Update node when role changes
roleSelect.addEventListener("change", () => {
  node.role = roleSelect.value;
  saveToLocalStorage();
  draw();
  updateInspector();
});

inspectorContent.appendChild(roleSelect);
// ====================== END ROLE DROPDOWN =====================

  // ------------------------------------------------------------
  // System Prompt
  // ------------------------------------------------------------
  const promptLabel = document.createElement("label");
  promptLabel.textContent = "System Prompt";

  const promptArea = document.createElement("textarea");
  promptArea.value = node.prompt;
  promptArea.addEventListener("input", () => {
    node.prompt = promptArea.value;
    saveToLocalStorage();
  });

  inspectorContent.appendChild(promptLabel);
  inspectorContent.appendChild(promptArea);

  // ------------------------------------------------------------
  // Delete Agent Button
  // ------------------------------------------------------------
  const deleteBtn = document.createElement("button");
  deleteBtn.textContent = "Delete Agent";
  deleteBtn.style.marginTop = "10px";
  deleteBtn.style.background = "#dc2626";
  deleteBtn.style.color = "#fff";
  deleteBtn.style.border = "none";
  deleteBtn.style.padding = "6px 10px";
  deleteBtn.style.borderRadius = "4px";
  deleteBtn.style.cursor = "pointer";

  deleteBtn.addEventListener("click", () => {
    const id = node.id;

    // Remove node
    graphState.nodes = graphState.nodes.filter((n) => n.id !== id);

    // Remove edges connected to this node
    graphState.edges = graphState.edges.filter(
      (e) => e.from !== id && e.to !== id
    );

    graphState.selectedNodeId = null;
    updateInspector();
    saveToLocalStorage();
    draw();
  });

  inspectorContent.appendChild(deleteBtn);
}

// ============================================================
// Keyboard Delete Support
// ============================================================

document.addEventListener("keydown", (e) => {
  if (
    (e.key === "Delete" || e.key === "Backspace") &&
    graphState.selectedNodeId
  ) {
    const id = graphState.selectedNodeId;

    // Remove node
    graphState.nodes = graphState.nodes.filter((n) => n.id !== id);

    // Remove edges connected to it
    graphState.edges = graphState.edges.filter(
      (e) => e.from !== id && e.to !== id
    );

    graphState.selectedNodeId = null;
    updateInspector();
    saveToLocalStorage();
    draw();
  }
});

    // ============================================================
    // JSON view toggle + schema generation
    // ============================================================
    function graphToSchema() {
      // Minimal schema: agents + routing
      return {
        agents: graphState.nodes.map((n) => ({
          id: n.id,
          name: n.name,
          model: n.model,
          prompt: n.prompt
        })),
        routing: graphState.edges.map((e) => ({
          from: e.from,
          to: e.to
        }))
      };
    }

    function schemaToGraph(schema) {
      // Very simple mapping back; assumes valid structure.
      graphState.nodes = schema.agents.map((a, idx) => ({
        id: a.id,
        x: 120 + idx * 200,
        y: 100,
        width: 160,
        height: 70,
        name: a.name,
        model: a.model,
        prompt: a.prompt
      }));
      graphState.edges = schema.routing.map((r) => ({
        from: r.from,
        to: r.to
      }));
      graphState.selectedNodeId = null;
      saveToLocalStorage();
      updateInspector();
      draw();
    }

    function showJsonView() {
      const schema = graphToSchema();
      jsonView.value = JSON.stringify(schema, null, 2);

      container.style.display = "none";
      jsonContainer.style.display = "block";
      jsonView.style.display = "block";
      toggleJsonBtn.textContent = "Graph View";
      statusLabel.textContent = "Editing JSON schema (Ctrl+S to apply).";
    }

    function showGraphView() {
      container.style.display = "grid";
      jsonContainer.style.display = "none";
      jsonView.style.display = "none";
      toggleJsonBtn.textContent = "JSON View";
      statusLabel.textContent = "";
      draw();
    }

    toggleJsonBtn.addEventListener("click", () => {
      if (jsonContainer.style.display === "block") {
        // Switch back to graph
        showGraphView();
      } else {
        // Switch to JSON
        showJsonView();
      }
    });

    // Allow Ctrl+S in JSON view to apply changes back to graph
    jsonView.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        try {
          const parsed = JSON.parse(jsonView.value);
          schemaToGraph(parsed);
          statusLabel.textContent = "JSON applied to graph.";
          showGraphView();
        } catch (err) {
          statusLabel.textContent = "Invalid JSON: " + err.message;
        }
      }
    });

    // ============================================================
    // Local storage persistence
    // ============================================================
    const STORAGE_KEY = "maestro_node_graph_v1";

    function saveToLocalStorage() {
      const payload = {
        nodes: graphState.nodes,
        edges: graphState.edges,
        nextId: graphState.nextId
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        console.warn("Failed to save graph:", err);
      }
    }

    function loadFromLocalStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        graphState.nodes = parsed.nodes || [];
        graphState.edges = parsed.edges || [];
        graphState.nextId = parsed.nextId || 1;
      } catch (err) {
        console.warn("Failed to load graph:", err);
      }
    }

// ============================================================
// Wire up buttons and initialize
// ============================================================
addAgentBtn.addEventListener("click", () => {
  addAgentNode();
});

loadFromLocalStorage();

// If no nodes yet, create a simple starter chain
if (graphState.nodes.length === 0) {
  const plannerId = "agent_" + graphState.nextId++;
  const coderId = "agent_" + graphState.nextId++;
  const reviewerId = "agent_" + graphState.nextId++;

  graphState.nodes.push(
    {
      id: plannerId,
      x: 120,
      y: 120,
      width: 300,
      height: 100,
      name: "Planner",
      model: MODEL_OPTIONS[0],
      prompt: "Plan the steps needed to solve the user's task.",
      role: "planner"
    },
    {
      id: coderId,
      x: 360,
      y: 120,
      width: 300,
      height: 100,
      name: "Coder",
      model: MODEL_OPTIONS[1],
      prompt: "Write clean, minimal code to implement the plan.",
      role: "coder"
    },
    {
      id: reviewerId,
      x: 600,
      y: 120,
      width: 300,
      height: 100,
      name: "Reviewer",
      model: MODEL_OPTIONS[0],
      prompt: "Review the code for correctness and simplicity.",
      role: "reviewer"
    }
  );

  graphState.edges.push(
    { from: plannerId, to: coderId },
    { from: coderId, to: reviewerId }
  );

  saveToLocalStorage();
}

// These MUST be outside the if-block
updateInspector();
draw();

</script>
