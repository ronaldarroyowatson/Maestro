<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Maestro Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="app-container">

        <!-- Left: Conversation Timeline -->
        <div id="conversation-panel">
            <div id="panel-header">
                <h2>Conversation</h2>
                <div id="status" class="status status-ready">Ready</div>
            </div>
            <div id="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            <div id="conversation"></div>
        </div>

        <!-- Right: Code + Controls -->
        <div id="right-panel">

            <div id="task-panel">
                <h2>New Task</h2>
                <textarea id="task-input" placeholder="Enter a task for Maestro..."></textarea>
                <button id="start-btn">Start Pipeline</button>
            </div>

            <div id="code-panel">
                <h2>Generated Code</h2>
                <div id="code-controls">
                    <button id="extract-btn" disabled>Extract from Chat</button>
                    <button id="save-btn" disabled>Save Code</button>
                </div>
                <pre id="code-output"></pre>
            </div>

            <div id="debug-panel">
                <h2>Debug Log</h2>
                <div id="debug-log"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
