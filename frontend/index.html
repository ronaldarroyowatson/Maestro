<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Maestro 2.0 Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="app-container">

        <!-- Left: Conversation Timeline -->
        <div id="conversation-panel">
            <h2>Conversation</h2>
            <div id="conversation"></div>
        </div>

        <!-- Right: Code + Controls -->
        <div id="right-panel">

            <div id="task-panel">
                <h2>New Task</h2>
                <textarea id="task-input" placeholder="Enter a task for Maestro..."></textarea>
                <button id="start-btn">Start</button>
            </div>

            <div id="code-panel">
                <h2>Generated Code</h2>
                <pre id="code-output"></pre>
            </div>

            <div id="debug-panel">
                <h2>Debug Log</h2>
                <div id="debug-log"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
