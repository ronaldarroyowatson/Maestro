---
name: Maestro Packages Linux
"on":
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: echo "MAESTRO_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Build and embed Otto core
        run: |
          mkdir -p dist/installers/linux/pkgroot/opt/maestro
          rsync -a --delete --exclude .git --exclude dist --exclude node_modules ./ dist/installers/linux/pkgroot/opt/maestro/
          chmod +x dist/installers/linux/pkgroot/opt/maestro/installer/linux/bootstrap.sh
          chmod +x dist/installers/linux/pkgroot/opt/maestro/otto/bin/otto
          chmod +x dist/installers/linux/pkgroot/opt/maestro/otto/bin/command-service

          git clone --depth 1 https://github.com/otto-systems/otto-command-service.git /tmp/otto-command-service
          git clone --depth 1 https://github.com/otto-systems/otto-update.git /tmp/otto-update
          npm --prefix /tmp/otto-command-service ci
          npm --prefix /tmp/otto-command-service run build
          npm --prefix /tmp/otto-update ci
          npm --prefix /tmp/otto-update run build

          mkdir -p dist/installers/linux/pkgroot/opt/maestro/otto/runtime/otto-command-service/dist
          mkdir -p dist/installers/linux/pkgroot/opt/maestro/otto/runtime/otto-update/dist
          rsync -a --delete /tmp/otto-command-service/dist/ dist/installers/linux/pkgroot/opt/maestro/otto/runtime/otto-command-service/dist/
          rsync -a --delete /tmp/otto-update/dist/ dist/installers/linux/pkgroot/opt/maestro/otto/runtime/otto-update/dist/
          rsync -a --delete /tmp/otto-update/manifests/ dist/installers/linux/pkgroot/opt/maestro/otto/manifests/

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build .deb and .rpm
        run: |
          mkdir -p dist/installers
          fpm -s dir -t deb -n maestro -v "$MAESTRO_VERSION" \
            --description "Maestro with embedded Otto core" \
            --prefix / \
            -C dist/installers/linux/pkgroot \
            opt/maestro
          mv maestro_${MAESTRO_VERSION}_amd64.deb dist/installers/maestro-installer-linux.deb

          fpm -s dir -t rpm -n maestro -v "$MAESTRO_VERSION" \
            --description "Maestro with embedded Otto core" \
            --prefix / \
            -C dist/installers/linux/pkgroot \
            opt/maestro
          mv maestro-${MAESTRO_VERSION}-1.x86_64.rpm dist/installers/maestro-installer-linux.rpm

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maestro-installers-linux-packages
          path: |
            dist/installers/maestro-installer-linux.deb
            dist/installers/maestro-installer-linux.rpm

      - name: Publish durable latest release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/installers/maestro-installer-linux.deb dist/installers/maestro-installer-linux.rpm --clobber
          else
            gh release create latest dist/installers/maestro-installer-linux.deb dist/installers/maestro-installer-linux.rpm --title "Latest Maestro Installers" --notes "Durable latest installer assets"
          fi