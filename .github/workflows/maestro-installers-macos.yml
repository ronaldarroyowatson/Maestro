name: Maestro Installers macOS

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare bootstrap installer
        run: |
          mkdir -p dist/installers
          cp installer/macos/bootstrap.sh dist/installers/maestro-installer-macos.sh
          chmod +x dist/installers/maestro-installer-macos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-installer-macos
          path: dist/installers/maestro-installer-macos.sh

      - name: Publish durable latest release artifact
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Maestro Installers
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/installers/maestro-installer-macos.sh
