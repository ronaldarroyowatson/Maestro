---
name: Maestro Installers macOS
"on":
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          MAESTRO_VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          test -n "$MAESTRO_VERSION"
          echo "MAESTRO_VERSION=$MAESTRO_VERSION" >> "$GITHUB_ENV"

      - name: Stage repository snapshot
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p dist/installers/macos/stage/opt/maestro
          rsync -a --delete --exclude .git --exclude dist --exclude node_modules --exclude '._*' ./ dist/installers/macos/stage/opt/maestro/
          find dist/installers/macos/stage -name '._*' -type f -delete
          chmod +x dist/installers/macos/stage/opt/maestro/installer/macos/bootstrap.sh
          chmod +x dist/installers/macos/stage/opt/maestro/otto/bin/otto
          chmod +x dist/installers/macos/stage/opt/maestro/otto/bin/command-service

      - name: Build and embed Otto core
        run: |
          mkdir -p dist/installers/macos/stage/opt/maestro/otto/runtime
          mkdir -p dist/installers/macos/stage/opt/maestro/otto/manifests
          mkdir -p dist/installers/macos/stage/opt/maestro/otto/extensions
          mkdir -p dist/installers/macos/stage/opt/maestro/otto/update

          git clone --depth 1 https://github.com/otto-systems/otto-command-service.git /tmp/otto-command-service
          git clone --depth 1 https://github.com/otto-systems/otto-update.git /tmp/otto-update

          npm --prefix /tmp/otto-command-service ci
          npm --prefix /tmp/otto-command-service run build
          npm --prefix /tmp/otto-update ci
          npm --prefix /tmp/otto-update run build

          mkdir -p dist/installers/macos/stage/opt/maestro/otto/runtime/otto-command-service
          mkdir -p dist/installers/macos/stage/opt/maestro/otto/runtime/otto-update
          rsync -a --delete /tmp/otto-command-service/dist/ dist/installers/macos/stage/opt/maestro/otto/runtime/otto-command-service/dist/
          rsync -a --delete /tmp/otto-update/dist/ dist/installers/macos/stage/opt/maestro/otto/runtime/otto-update/dist/
          rsync -a --delete /tmp/otto-update/manifests/ dist/installers/macos/stage/opt/maestro/otto/manifests/

      - name: Create Maestro app bundle
        run: |
          APP_DIR="dist/installers/macos/stage/Applications/Maestro.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          cat > "${APP_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Maestro</string>
            <key>CFBundleExecutable</key>
            <string>Maestro</string>
            <key>CFBundleIdentifier</key>
            <string>com.otto-systems.maestro.app</string>
            <key>CFBundleName</key>
            <string>Maestro</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${MAESTRO_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${MAESTRO_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          EOF
          cat > "${APP_DIR}/Contents/MacOS/Maestro" <<'EOF'
          #!/bin/sh
          exec /opt/maestro/installer/macos/bootstrap.sh "$@"
          EOF
          chmod +x "${APP_DIR}/Contents/MacOS/Maestro"

      - name: Prepare postinstall hook
        run: |
          mkdir -p dist/installers/macos/scripts
          cat <<'EOF' > dist/installers/macos/scripts/postinstall
          #!/bin/sh
          set -e

          BOOTSTRAP="/opt/maestro/installer/macos/bootstrap.sh"
          APP_DIR="/Applications/Maestro.app"
          LOG_FILE="/var/log/maestro-installer.log"

          if ! touch "$LOG_FILE" >/dev/null 2>&1; then
            LOG_FILE="/tmp/maestro-installer.log"
            touch "$LOG_FILE" >/dev/null 2>&1 || true
          fi
          echo "[$(date)] Maestro postinstall start" >> "$LOG_FILE" 2>/dev/null || true

          if [ ! -f "$BOOTSTRAP" ]; then
            echo "[$(date)] ERROR: missing bootstrap script at $BOOTSTRAP" >> "$LOG_FILE" 2>/dev/null || true
            exit 1
          fi

          chmod +x "$BOOTSTRAP"

          if [ -n "${OTTO_BIN:-}" ]; then
            if command -v "$OTTO_BIN" >/dev/null 2>&1; then
              "$BOOTSTRAP" >> "$LOG_FILE" 2>&1
              exit 0
            fi
            echo "[$(date)] WARN: OTTO_BIN is set but not found ($OTTO_BIN); skipping bootstrap" >> "$LOG_FILE" 2>/dev/null || true
            exit 0
          fi

          "$BOOTSTRAP" >> "$LOG_FILE" 2>&1

          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cat > "$APP_DIR/Contents/Info.plist" <<'APPINFOEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Maestro</string>
            <key>CFBundleExecutable</key>
            <string>Maestro</string>
            <key>CFBundleIdentifier</key>
            <string>com.otto-systems.maestro.app</string>
            <key>CFBundleName</key>
            <string>Maestro</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>__MAESTRO_VERSION__</string>
            <key>CFBundleVersion</key>
            <string>__MAESTRO_VERSION__</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          APPINFOEOF
          cat > "$APP_DIR/Contents/MacOS/Maestro" <<'APPEXEOF'
          #!/bin/sh
          exec /opt/maestro/installer/macos/bootstrap.sh "$@"
          APPEXEOF
          chmod +x "$APP_DIR/Contents/MacOS/Maestro"
          EOF
          sed -i '' "s/__MAESTRO_VERSION__/${MAESTRO_VERSION}/g" dist/installers/macos/scripts/postinstall
          chmod +x dist/installers/macos/scripts/postinstall

      - name: Build unsigned package
        run: |
          pkgbuild \
            --root dist/installers/macos/stage \
            --scripts dist/installers/macos/scripts \
            --identifier com.otto-systems.maestro.installer \
            --version "$MAESTRO_VERSION" \
            dist/installers/maestro-installer-macos.pkg

      - name: Sign embedded Mach-O binaries
        run: |
          if [ -z "${MAESTRO_APPLE_DEVELOPER_ID_APPLICATION:-}" ]; then
            echo "Skipping Mach-O signing: MAESTRO_APPLE_DEVELOPER_ID_APPLICATION is not set"
            exit 0
          fi
          find dist/installers/macos/stage -type f -perm -111 | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$MAESTRO_APPLE_DEVELOPER_ID_APPLICATION" "$file"
            fi
          done

      - name: Sign package
        run: |
          if [ -z "${MAESTRO_APPLE_DEVELOPER_ID_INSTALLER:-}" ]; then
            echo "Skipping pkg signing: MAESTRO_APPLE_DEVELOPER_ID_INSTALLER is not set"
            exit 0
          fi
          productsign \
            --sign "$MAESTRO_APPLE_DEVELOPER_ID_INSTALLER" \
            dist/installers/maestro-installer-macos.pkg \
            dist/installers/maestro-installer-macos-signed.pkg
          mv dist/installers/maestro-installer-macos-signed.pkg dist/installers/maestro-installer-macos.pkg

      - name: Submit package for notarization
        run: |
          if [ -z "${MAESTRO_NOTARY_APPLE_ID:-}" ] || [ -z "${MAESTRO_NOTARY_TEAM_ID:-}" ] || [ -z "${MAESTRO_NOTARY_APP_PASSWORD:-}" ]; then
            echo "Skipping notarization: notary credentials are not fully configured"
            exit 0
          fi
          xcrun notarytool submit dist/installers/maestro-installer-macos.pkg \
            --apple-id "$MAESTRO_NOTARY_APPLE_ID" \
            --team-id "$MAESTRO_NOTARY_TEAM_ID" \
            --password "$MAESTRO_NOTARY_APP_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        run: |
          if [ -z "${MAESTRO_NOTARY_APPLE_ID:-}" ] || [ -z "${MAESTRO_NOTARY_TEAM_ID:-}" ] || [ -z "${MAESTRO_NOTARY_APP_PASSWORD:-}" ]; then
            echo "Skipping stapling: notary credentials are not fully configured"
            exit 0
          fi
          xcrun stapler staple dist/installers/maestro-installer-macos.pkg
          xcrun stapler validate dist/installers/maestro-installer-macos.pkg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-installer-macos
          path: dist/installers/maestro-installer-macos.pkg

      - name: Publish durable latest release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/installers/maestro-installer-macos.pkg --clobber
          else
            gh release create latest dist/installers/maestro-installer-macos.pkg --title "Latest Maestro Installers" --notes "Durable latest installer assets"
          fi