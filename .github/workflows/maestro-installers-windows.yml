---
name: Maestro Installers Windows
"on":
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Maestro dependencies
        shell: pwsh
        run: npm ci

      - name: Verify backbone routing and diagnostics artifacts
        shell: pwsh
        run: |
          npm test -- features/conductor/tests/conductor-provider-routing.integration.test.ts features/conductor/tests/conductor-otto-observability.integration.test.ts features/provider-registry/tests/provider-registry.test.ts
          npm run verify:diagnostics-artifacts

      - name: Upload diagnostics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maestro-diagnostics-artifacts
          path: dist/diagnostics/*.json

      - name: Resolve version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Add-Content -Path $env:GITHUB_ENV -Value "MAESTRO_VERSION=$version"

      - name: Stage repository snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro | Out-Null
          robocopy . dist/installers/windows/stage/Maestro /E /XD .git dist node_modules | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          if (Test-Path dist/installers/windows/stage/Maestro/installer/windows/bootstrap.ps1) {
            Unblock-File dist/installers/windows/stage/Maestro/installer/windows/bootstrap.ps1
          }
          if (Test-Path dist/installers/windows/stage/Maestro/otto/bin/otto) {
            Unblock-File dist/installers/windows/stage/Maestro/otto/bin/otto
          }
          if (Test-Path dist/installers/windows/stage/Maestro/otto/bin/command-service) {
            Unblock-File dist/installers/windows/stage/Maestro/otto/bin/command-service
          }

      - name: Build and embed Otto core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro/otto/runtime | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro/otto/manifests | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro/otto/extensions | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro/otto/update | Out-Null

          git clone --depth 1 https://github.com/otto-systems/otto-command-service.git $env:TEMP/otto-command-service
          git clone --depth 1 https://github.com/otto-systems/otto-update.git $env:TEMP/otto-update

          npm --prefix $env:TEMP/otto-command-service ci
          npm --prefix $env:TEMP/otto-command-service run build
          npm --prefix $env:TEMP/otto-update ci
          npm --prefix $env:TEMP/otto-update run build

          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro/otto/runtime/otto-command-service/dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installers/windows/stage/Maestro/otto/runtime/otto-update/dist | Out-Null
          robocopy $env:TEMP/otto-command-service/dist dist/installers/windows/stage/Maestro/otto/runtime/otto-command-service/dist /E | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          robocopy $env:TEMP/otto-update/dist dist/installers/windows/stage/Maestro/otto/runtime/otto-update/dist /E | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          robocopy $env:TEMP/otto-update/manifests dist/installers/windows/stage/Maestro/otto/manifests /E | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }

      - name: Install PS2EXE
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build executable installer
        shell: pwsh
        run: |
          $archivePath = Join-Path $PWD 'dist/installers/windows/maestro-payload.zip'
          if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
          Compress-Archive -Path 'dist/installers/windows/stage/Maestro' -DestinationPath $archivePath -Force

          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($archivePath))
          $wrapperPath = Join-Path $PWD 'dist/installers/windows/maestro-installer-windows.ps1'
          $wrapperLines = @(
            '$ErrorActionPreference = ''Stop''',
            '',
            '$payloadBase64 = @''',
            $base64,
            ''@',
            '',
            '$installRoot = Join-Path $env:ProgramFiles ''Maestro''',
            '',
            'if ($env:OTTO_DRY_RUN -eq ''1'') {',
            '  Write-Host "[dry-run] would install Maestro to $installRoot"',
            '  exit 0',
            '}',
            '',
            'New-Item -ItemType Directory -Force -Path $env:ProgramFiles | Out-Null',
            '$tempZip = Join-Path $env:TEMP ''maestro-install.zip''',
            '[IO.File]::WriteAllBytes($tempZip, [Convert]::FromBase64String($payloadBase64))',
            'Expand-Archive -Path $tempZip -DestinationPath $env:ProgramFiles -Force',
            '& (Join-Path $installRoot ''installer/windows/bootstrap.ps1'')'
          )
          $wrapperLines | Set-Content -Path $wrapperPath -Encoding UTF8

          Import-Module ps2exe
          Invoke-PS2EXE -InputFile $wrapperPath -OutputFile (Join-Path $PWD 'dist/installers/maestro-installer-windows.exe') -NoConsole -RequireAdmin -Title 'Maestro Installer'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-installer-windows
          path: dist/installers/maestro-installer-windows.exe

      - name: Publish durable latest release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo ronaldarroyowatson/Maestro *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest dist/installers/maestro-installer-windows.exe --repo ronaldarroyowatson/Maestro --clobber
          } else {
            gh release create latest dist/installers/maestro-installer-windows.exe --repo ronaldarroyowatson/Maestro --title "Latest Maestro Installers" --notes "Durable latest installer assets"
          }