---
name: Maestro Installers Linux
"on":
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: echo "MAESTRO_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Stage repository snapshot
        run: |
          mkdir -p dist/installers/linux/stage/opt/maestro
          rsync -a --delete --exclude .git --exclude dist --exclude node_modules ./ dist/installers/linux/stage/opt/maestro/
          chmod +x dist/installers/linux/stage/opt/maestro/installer/linux/bootstrap.sh
          chmod +x dist/installers/linux/stage/opt/maestro/otto/bin/otto
          chmod +x dist/installers/linux/stage/opt/maestro/otto/bin/command-service

      - name: Build and embed Otto core
        run: |
          mkdir -p dist/installers/linux/stage/opt/maestro/otto/runtime
          mkdir -p dist/installers/linux/stage/opt/maestro/otto/manifests
          mkdir -p dist/installers/linux/stage/opt/maestro/otto/extensions
          mkdir -p dist/installers/linux/stage/opt/maestro/otto/update

          git clone --depth 1 https://github.com/otto-systems/otto-command-service.git /tmp/otto-command-service
          git clone --depth 1 https://github.com/otto-systems/otto-update.git /tmp/otto-update

          npm --prefix /tmp/otto-command-service ci
          npm --prefix /tmp/otto-command-service run build
          npm --prefix /tmp/otto-update ci
          npm --prefix /tmp/otto-update run build

          mkdir -p dist/installers/linux/stage/opt/maestro/otto/runtime/otto-command-service
          mkdir -p dist/installers/linux/stage/opt/maestro/otto/runtime/otto-update
          rsync -a --delete /tmp/otto-command-service/dist/ dist/installers/linux/stage/opt/maestro/otto/runtime/otto-command-service/dist/
          rsync -a --delete /tmp/otto-update/dist/ dist/installers/linux/stage/opt/maestro/otto/runtime/otto-update/dist/
          rsync -a --delete /tmp/otto-update/manifests/ dist/installers/linux/stage/opt/maestro/otto/manifests/

      - name: Build self-extracting installer
        run: |
          mkdir -p dist/installers/linux
          tar -C dist/installers/linux/stage -czf dist/installers/linux/maestro-payload.tar.gz opt/maestro
          cat <<'EOF' > dist/installers/maestro-installer-linux.sh
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${OTTO_DRY_RUN:-0}" == "1" ]]; then
            echo "[dry-run] would install Maestro into /opt/maestro"
            exit 0
          fi

          if [[ "${EUID:-$(id -u)}" -ne 0 ]]; then
            exec sudo "$0" "$@"
          fi

          archive_line="$(awk '/^__ARCHIVE_BELOW__$/ { print NR + 1; exit 0; }' "$0")"
          tail -n +"${archive_line}" "$0" | tar -xz -C /
          chmod +x /opt/maestro/installer/linux/bootstrap.sh
          bash /opt/maestro/installer/linux/bootstrap.sh "$@"
          exit 0

          __ARCHIVE_BELOW__
          EOF
          cat dist/installers/linux/maestro-payload.tar.gz >> dist/installers/maestro-installer-linux.sh
          chmod +x dist/installers/maestro-installer-linux.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-installer-linux
          path: dist/installers/maestro-installer-linux.sh

      - name: Publish durable latest release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/installers/maestro-installer-linux.sh --clobber
          else
            gh release create latest dist/installers/maestro-installer-linux.sh --title "Latest Maestro Installers" --notes "Durable latest installer assets"
          fi