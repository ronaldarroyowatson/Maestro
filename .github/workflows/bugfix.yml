name: Bugfix Workflow

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  bugfix-validation:
    name: Bugfix Policy And Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate bugfix policy
        env:
          BUGFIX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUGFIX_HEAD_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python .github/scripts/validate_bugfix_commit.py

      - name: Run full test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run installer lifecycle tests in sandbox
        run: |
          python tests/installer/run_installer_tests.py

      - name: Store bugfix summary in MemPalace workspace
        shell: pwsh
        run: |
          $summaryDir = ".mempalace/palace/bugfix_summaries"
          New-Item -ItemType Directory -Path $summaryDir -Force | Out-Null
          $summaryFile = Join-Path $summaryDir ("ci-" + "${{ github.run_id }}" + ".md")
          @"
          # Bugfix Run Summary
          run_id: ${{ github.run_id }}
          sha: ${{ github.sha }}
          ref: ${{ github.ref_name }}
          workflow: bugfix.yml
          
          This summary was generated by CI to support MemPalace bugfix history ingestion.
          "@ | Set-Content -Path $summaryFile -Encoding utf8

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-test-reports
          path: |
            tests/installer/reports/*.json
            .mempalace/palace/bugfix_summaries/*.md
